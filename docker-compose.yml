# Local dependencies for development. The backend and frontend run on the host
# (`cargo run` / `pnpm dev`) so the `ostree` and `flatpak` binaries they shell
# out to are the ones you already have installed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flatnexus
      POSTGRES_PASSWORD: flatnexus
      POSTGRES_DB: flatnexus
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied on first boot of an empty volume.
      - ./flatnexus-backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flatnexus']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail so emailed one-time codes are readable without a real
  # SMTP account. Web UI on http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Stands in for DigitalOcean Spaces locally. Both are S3-compatible, so the
  # server runs the identical code path against either — point
  # FLATNEXUS_SPACES_ENDPOINT at http://localhost:9000 and use the credentials
  # below. Console on http://localhost:9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flatnexus
      MINIO_ROOT_PASSWORD: flatnexus-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot, then exits. Without it the server would
  # fail its first upload against an empty MinIO.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 flatnexus flatnexus-dev-secret &&
      mc mb --ignore-existing local/flatnexus-bundles
      "

volumes:
  postgres-data:
  minio-data:
